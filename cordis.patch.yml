# One more instance of dsh's own filesystem skill provider, scanning only this
# package's skills/ (the path is resolved from wherever the package is installed:
# npm, GitHub or a local checkout), and this package's own row: in Web and Desktop
# it serves the Meshy settings page and the GLB preview, elsewhere it does nothing.
- insert:
    - id: meshy
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: meshy
        includeDefaultRoots: false
        watch: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('meshy-dsh/package.json'), '..', 'skills')"
    - id: meshy-ui
      name: 'meshy-dsh'
