name: publish

# Publishes one release to npm, like meshy-cli and meshy-dcc-core. Create the GitHub
# Release for the tag first, then run this workflow by hand from main ("Run workflow")
# with that tag. A rerun for a version already on npm does nothing.
#
# No npm token is stored anywhere: it publishes through npm trusted publishing (GitHub
# OIDC), with provenance. On npmjs.com the package trusts meshy-dev/meshy-dsh, this
# workflow file (publish.yml) and the `release` environment, which only `main` may deploy
# to. Renaming the file or the environment breaks publishing until the npm setting is
# recreated.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the GitHub Release to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # dsh installs plugins with pnpm; the smoke test needs it.
      - run: npm install -g pnpm@10

      - name: package.json version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::package.json is $VERSION but the tag is $TAG. Bump package.json and CHANGELOG.md first."
            exit 1
          fi

      - run: npm ci
      # lib/client*.js is committed so a GitHub install needs no build; it must match src/.
      - name: Built client matches its sources
        run: npm run build && git diff --exit-code -- lib

      - run: npm test
      - run: node scripts/sync-skills.mjs --check
      - run: node scripts/smoke.mjs

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10. Upgraded only
      # here, so the checks above run on the stock npm.
      - run: npm install -g npm@^11.5.1

      # npm accepts the tarball before it is installable, so a green run is not yet "live":
      # confirm against https://registry.npmjs.org/meshy-dsh afterwards.
      - name: Publish to npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if npm view "meshy-dsh@${TAG#v}" version > /dev/null 2>&1; then
            echo "meshy-dsh@${TAG#v} is already on npm; skipping"
          else
            npm publish --access public --provenance
          fi
