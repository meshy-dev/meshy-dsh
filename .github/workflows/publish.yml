name: publish

# Publishes one release to npm, like meshy-cli and meshy-dcc-core. Create the GitHub
# Release for the tag first, then run this workflow by hand from main ("Run workflow")
# with that tag. A rerun for a version already on npm does nothing.
#
# No credentials live in GitHub. The job assumes the AWS role meshy-dsh-github-release
# through GitHub OIDC (main only) and reads the npm token meshy-dcc-core publishes with from
# AWS Secrets Manager (meshy-dcc/release/npm-token). Setup: scripts/release/aws/.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the GitHub Release to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # dsh installs plugins with pnpm; the smoke test needs it.
      - run: npm install -g pnpm@10

      - name: package.json version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::package.json is $VERSION but the tag is $TAG. Bump package.json and CHANGELOG.md first."
            exit 1
          fi

      - run: npm ci
      # lib/client*.js is committed so a GitHub install needs no build; it must match src/.
      - name: Built client matches its sources
        run: npm run build && git diff --exit-code -- lib

      - run: npm test
      - run: node scripts/sync-skills.mjs --check
      - run: node scripts/smoke.mjs

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::133081291590:role/meshy-dsh-github-release

      # Exported as NPM_TOKEN and masked in the log.
      - uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            NPM_TOKEN,meshy-dcc/release/npm-token

      # npm accepts the tarball before it is installable, so a green run is not yet "live":
      # confirm against https://registry.npmjs.org/meshy-dsh afterwards.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if npm view "meshy-dsh@${TAG#v}" version > /dev/null 2>&1; then
            echo "meshy-dsh@${TAG#v} is already on npm; skipping"
          else
            npm publish --access public --provenance
          fi
